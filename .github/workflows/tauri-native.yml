name: Tauri Windows portable verification

on:
  pull_request:
  push:
    branches: [release/developer-alpha-preview, docs/task-20261115-library-modernization]
  workflow_dispatch:
    inputs:
      override_pause:
        description: "Override pause until 2026-12-01 (set to 'run')"
        required: false
        default: ""
      architecture:
        description: "Windows architecture to verify"
        type: choice
        options: [both, x64, arm64]
        default: both

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.workflow }}-${{ github.ref }}-${{ inputs.architecture || 'both' }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "2"
  CARGO_TARGET_DIR: target/tauri-native

jobs:
  tauri:
    name: Tauri (${{ matrix.target }})
    # CI/CD paused until 2026-12-01 per project directive
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.override_pause == 'run'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: >-
          ${{ fromJSON(inputs.architecture == 'x64' &&
          '[{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","platform":"windows","node_arch":"x64","triplet":"x64-windows"}]' ||
          inputs.architecture == 'arm64' &&
          '[{"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","platform":"windows","node_arch":"arm64","triplet":"arm64-windows"}]' ||
          '[{"runner":"windows-2025","target":"x86_64-pc-windows-msvc","platform":"windows","node_arch":"x64","triplet":"x64-windows"},{"runner":"windows-11-arm","target":"aarch64-pc-windows-msvc","platform":"windows","node_arch":"arm64","triplet":"arm64-windows"}]') }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          fetch-depth: 3
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.node_arch }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: tauri-${{ matrix.target }}
          workspaces: rust/gui-spike -> ../../target/tauri-native
          cache-on-failure: true

      - name: Record native build environment
        env:
          EXPECTED_ARCH: ${{ matrix.node_arch }}
        run: |
          node -e 'if (process.arch !== process.env.EXPECTED_ARCH) throw new Error(`Expected native ${process.env.EXPECTED_ARCH}, got ${process.arch}`); console.log({platform:process.platform, arch:process.arch})'
          rustc --version --verbose
          rustc --print cfg --target "${{ matrix.target }}"

      - name: Configure Windows package cache
        id: vcpkg_paths
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $tauriBinaryCache = Join-Path $env:RUNNER_TEMP 'tauri-vcpkg-binary-cache'
          New-Item -ItemType Directory -Path $tauriBinaryCache -Force | Out-Null
          "VCPKG_DEFAULT_BINARY_CACHE=$tauriBinaryCache" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "binary_cache=$tauriBinaryCache" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Restore Windows package cache
        id: vcpkg_cache
        if: matrix.platform == 'windows'
        uses: actions/cache/restore@v5
        with:
          path: ${{ steps.vcpkg_paths.outputs.binary_cache }}
          key: tauri-vcpkg-${{ runner.os }}-${{ matrix.triplet }}-${{ github.sha }}
          restore-keys: tauri-vcpkg-${{ runner.os }}-${{ matrix.triplet }}-

      - name: Windows Tauri libraries
        id: windows_libraries
        if: matrix.platform == 'windows'
        shell: pwsh
        env:
          TAURI_VCPKG_TRIPLET: ${{ matrix.triplet }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:VCPKG_INSTALLATION_ROOT) { throw 'The native vcpkg installation is required' }
          $triplet = $env:TAURI_VCPKG_TRIPLET
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install "sqlite3:$triplet" "hunspell:$triplet" "openssl:$triplet"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $tauriNativePrefix = Join-Path $env:VCPKG_INSTALLATION_ROOT "installed/$triplet"
          "VCPKG_ROOT=$env:VCPKG_INSTALLATION_ROOT" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_TRIPLET=$triplet" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "VCPKGRS_DYNAMIC=1" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "LIB=$tauriNativePrefix/lib;$env:LIB" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TAURI_NATIVE_DLL_DIR=$tauriNativePrefix/bin" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "$tauriNativePrefix/bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify the login DOM and shell
        run: |
          node --test tests/unit/gui-spike-auth.test.mjs tests/unit/qr-auth-modal.test.mjs tests/unit/shell-bridge.test.mjs

      - name: Tauri release compilation
        id: tauri_build
        run: |
          cargo build --locked --release --manifest-path rust/gui-spike/Cargo.toml \
            --target "${{ matrix.target }}" --features tauri/custom-protocol

      - name: Tauri contracts
        id: tauri_contracts
        if: ${{ !cancelled() && steps.tauri_build.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path rust/gui-spike/Cargo.toml \
            --target "${{ matrix.target }}" --features tauri/custom-protocol --lib --tests --no-fail-fast

      - name: Save Windows voice contract diagnostics
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.tauri_contracts.outcome == 'failure' }}
        uses: actions/upload-artifact@v6
        with:
          name: voice-contract-diagnostics-${{ matrix.target }}
          path: target/tauri-native/${{ matrix.target }}/debug/**/voice_plugin_contract-*.exe
          if-no-files-found: ignore
          retention-days: 3

      - name: Native identity contracts
        if: ${{ !cancelled() && steps.tauri_build.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p chord-core \
            --target "${{ matrix.target }}" --lib --test rest_identity

      - name: Native platform contracts
        if: ${{ !cancelled() && steps.tauri_build.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p chord-platform -p chord-audio-runtime \
            --target "${{ matrix.target }}" --lib --tests --no-fail-fast

      - name: Native store key contracts
        if: ${{ !cancelled() && steps.tauri_build.outcome == 'success' }}
        run: |
          cargo test --locked --manifest-path rust/Cargo.toml -p chord-store \
            --target "${{ matrix.target }}" --test keyring_crypto_contract

      - name: Stage compiled binary and provenance
        id: tauri_artifact
        if: ${{ !cancelled() && steps.tauri_build.outcome == 'success' }}
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: |
          node --input-type=module <<'JS'
          import { copyFileSync, existsSync, mkdirSync, readFileSync, readdirSync, statSync, writeFileSync } from 'node:fs';
          import { createHash } from 'node:crypto';
          import { execFileSync } from 'node:child_process';
          import { dirname, join, sep } from 'node:path';
          const target = process.env.TAURI_TARGET;
          const directory = join('artifacts', `tauri-${target}`);
          mkdirSync(directory, { recursive: true });
          const filename = process.platform === 'win32' ? 'chord-client.exe' : 'chord-client';
          copyFileSync(join(process.env.CARGO_TARGET_DIR, target, 'release', filename), join(directory, filename));
          for (const name of ['LICENSE', 'LICENSE-MIT', 'LICENSE-APACHE', 'NOTICE']) {
            if (existsSync(name)) copyFileSync(name, join(directory, name));
          }
          if (process.platform === 'win32') {
            const nativeDirectory = process.env.TAURI_NATIVE_DLL_DIR;
            if (!nativeDirectory || !existsSync(nativeDirectory)) throw new Error('Native DLL directory is missing');
            for (const name of readdirSync(nativeDirectory).filter(name => name.toLowerCase().endsWith('.dll'))) {
              copyFileSync(join(nativeDirectory, name), join(directory, name));
            }
            const shared = join(dirname(nativeDirectory), 'share');
            const licenses = join(directory, 'licenses');
            mkdirSync(licenses);
            let copyrights = 0;
            for (const port of readdirSync(shared)) {
              const copyright = join(shared, port, 'copyright');
              if (existsSync(copyright)) {
                copyFileSync(copyright, join(licenses, `${port}.txt`));
                copyrights += 1;
              }
            }
            if (copyrights === 0) throw new Error('Bundled native DLL copyright records are missing');
          }
          const SHA256 = path => createHash('sha256').update(readFileSync(path)).digest('hex');
          const files = Object.fromEntries(readdirSync(directory, { recursive: true })
            .filter(name => statSync(join(directory, name)).isFile())
            .map(name => [name.split(sep).join('/'), SHA256(join(directory, name))]));
          const provenance = { target, source_commit: execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim(),
            build_host: { platform: process.platform, arch: process.arch },
            compiler: execFileSync('rustc', ['--version', '--verbose'], { encoding: 'utf8' }),
            cargo_lock_sha256: SHA256('rust/gui-spike/Cargo.lock'), files, native_runtime_qualified: false };
          writeFileSync(join(directory, 'provenance.json'), JSON.stringify(provenance, null, 2) + '\n');
          writeFileSync(join(directory, 'SHA256SUMS'), Object.entries(files).map(([name, hash]) => `${hash}  ${name}\n`).join(''));
          JS

      - name: Smoke-test the packaged WebView2 without fixtures
        id: portable_smoke
        env:
          TAURI_TARGET: ${{ matrix.target }}
        run: node .github/scripts/tauri-windows-portable-smoke.mjs

      - name: Upload Tauri build artifact
        if: ${{ success() && steps.portable_smoke.outcome == 'success' }}
        uses: actions/upload-artifact@v6
        with:
          name: tauri-${{ matrix.target }}
          path: artifacts/tauri-${{ matrix.target }}/
          if-no-files-found: error
          retention-days: 14

      - name: Save Windows package cache
        if: ${{ !cancelled() && matrix.platform == 'windows' && steps.windows_libraries.outcome == 'success' && steps.vcpkg_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: ${{ steps.vcpkg_paths.outputs.binary_cache }}
          key: ${{ steps.vcpkg_cache.outputs.cache-primary-key }}
