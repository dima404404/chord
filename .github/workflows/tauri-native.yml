name: Tauri portable Windows release QA

on:
  workflow_dispatch:
    inputs:
      override_pause:
        description: "Run the targeted Windows release smoke check (set to 'run')"
        required: true
        default: ""

permissions:
  contents: read
  actions: read

jobs:
  windows:
    name: Windows portable smoke (${{ matrix.arch }})
    if: inputs.override_pause == 'run'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2025
            arch: x64
            target: x86_64-pc-windows-msvc
            artifact: "14752783659"
            provenance_sha256: 59c15c4fd5d67ef631e84fe9316929f4d190a2b77789e31329b232f1f55f5a1b
          - runner: windows-11-arm
            arch: arm64
            target: aarch64-pc-windows-msvc
            artifact: "14752968237"
            provenance_sha256: 90999fd54aface57eb41729ade5f06352a93611df0ea4aed94eb51307547596d
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          architecture: ${{ matrix.arch }}
      - uses: actions/download-artifact@v7
        with:
          artifact-ids: ${{ matrix.artifact }}
          github-token: ${{ github.token }}
          run-id: "45018634225"
          path: portable
          merge-multiple: true
      - name: Verify ZIP contents and launch the offline UI fixture
        env:
          CHORD_PACKAGE_TARGET: ${{ matrix.target }}
          CHORD_PACKAGE_ARCH: ${{ matrix.arch }}
          CHORD_PROVENANCE_SHA256: ${{ matrix.provenance_sha256 }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { execFile } from 'node:child_process';
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { join, resolve } from 'node:path';
          import { promisify } from 'node:util';

          const source = '0e8b94fa522f40edd6a51294743b1acfbb64baa3';
          const directory = resolve('portable');
          const target = process.env.CHORD_PACKAGE_TARGET;
          const sha256 = bytes => createHash('sha256').update(bytes).digest('hex');
          assert.equal(process.platform, 'win32');
          assert.equal(process.arch, process.env.CHORD_PACKAGE_ARCH);
          const receipt = readFileSync(join(directory, 'provenance.json'));
          assert.equal(sha256(receipt), process.env.CHORD_PROVENANCE_SHA256);
          const provenance = JSON.parse(receipt);
          assert.equal(provenance.source_commit, source);
          assert.equal(provenance.target, target);
          for (const [filename, digest] of Object.entries(provenance.files)) {
            assert.equal(sha256(readFileSync(join(directory, filename))), digest, filename);
          }

          const launched = Date.now();
          const { stdout, stderr } = await promisify(execFile)(join(directory, 'chord-client.exe'), [], {
            cwd: directory,
            timeout: 60_000,
            windowsHide: true,
            env: {
              ...process.env,
              SPIKE_AUTH_DISABLED: '1',
              SPIKE_AUTOBENCH: '0',
              SPIKE_EXIT_AFTER_MS: '12000',
              WEBVIEW2_USER_DATA_FOLDER: resolve('webview-profile'),
            },
          });
          assert.ok(Date.now() - launched >= 11_000, 'The window closed before the fixture elapsed');
          assert.match(stdout, /window-ready/, stderr);
          assert.doesNotMatch(stderr, /panic|segmentation fault/i);
          const snapshotLine = stdout.split(/\r?\n/).find(line => line.startsWith('UI_SNAPSHOT '));
          assert.ok(snapshotLine, 'The packaged WebView did not report its UI snapshot');
          const snapshot = JSON.parse(snapshotLine.slice('UI_SNAPSHOT '.length));
          const expected = { screenCount: 4, chatRows: 100000, memberRows: 24229, emojiCategories: 10, settingsToggles: 38 };
          for (const [field, value] of Object.entries(expected)) assert.equal(snapshot[field], value, field);
          const result = { status: 'passed', target, source_commit: source, provenance_sha256: sha256(receipt),
            executable_sha256: provenance.files['chord-client.exe'], snapshot };
          writeFileSync('windows-smoke.json', JSON.stringify(result, null, 2) + '\n');
          console.log(JSON.stringify(result));
          JS
      - uses: actions/upload-artifact@v6
        with:
          name: windows-smoke-${{ matrix.target }}
          path: windows-smoke.json
          if-no-files-found: error
          retention-days: 14
